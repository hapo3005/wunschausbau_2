name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Für den Livegang exakt LIVE eingeben'
        required: true
        type: string
      note:
        description: 'Optionaler Release-Hinweis'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wunschausbau-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate & Deploy Production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://wunschausbau.de
    env:
      QA_BASE_URL: http://127.0.0.1:4321
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      PRODUCTION_LAUNCH: 'true'
      MANUAL_PRODUCTION_DEPLOY: 'true'
      DEPLOY_CONFIRM: ${{ inputs.confirm }}
      RELEASE_NOTE: ${{ inputs.note }}
    steps:
      - name: Live-Bestätigung prüfen
        run: |
          if [ "$DEPLOY_CONFIRM" != "LIVE" ]; then
            echo "Livegang abgebrochen: Bestätigung muss exakt LIVE lauten."
            exit 1
          fi

      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Ausgecheckten Commit verifizieren
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Produktionskandidat: $GITHUB_SHA"

      - name: Node einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Projekt installieren
        run: npm ci

      - name: Produktionsabhängigkeiten prüfen
        run: npm audit --omit=dev --audit-level=high

      - name: Release Gate prüfen
        run: npm run qa:release

      - name: Produktionsbuild erzeugen
        run: npm run build

      - name: Produktions-HTML und interne Links prüfen
        run: npm run qa:static:production

      - name: Browser-QA Werkzeuge installieren
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 @axe-core/playwright@4.10.2 lighthouse@12.8.2
          npx playwright install --with-deps chromium webkit

      - name: Produktionskandidat lokal starten
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/wunschausbau-production-preview.log 2>&1 &
          echo $! > /tmp/wunschausbau-production-preview.pid
          for i in {1..30}; do
            if curl -fsS "$QA_BASE_URL/" > /dev/null; then
              echo "Produktionskandidat erreichbar."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wunschausbau-production-preview.log
          exit 1

      - name: Chromium Visual QA
        id: visual
        continue-on-error: true
        run: npm run qa:visual

      - name: Motion & No-JS QA
        id: motion
        continue-on-error: true
        run: node scripts/motion-qa.mjs

      - name: WebKit iPhone QA
        id: webkit
        continue-on-error: true
        run: node scripts/webkit-qa.mjs

      - name: Lighthouse Audit
        id: lighthouse
        continue-on-error: true
        run: |
          mkdir -p qa-artifacts/lighthouse
          export CHROME_PATH="$(node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")"
          npx lighthouse "$QA_BASE_URL/" \
            --quiet \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output=html \
            --output-path=qa-artifacts/lighthouse/home
          npm run qa:lighthouse

      - name: Static QA Report erneuern
        if: always()
        run: npm run qa:static:production

      - name: Quality Gate
        if: always()
        run: |
          echo "Visual QA: ${{ steps.visual.outcome }}"
          echo "Motion QA: ${{ steps.motion.outcome }}"
          echo "WebKit iPhone QA: ${{ steps.webkit.outcome }}"
          echo "Lighthouse: ${{ steps.lighthouse.outcome }}"
          if [ "${{ steps.visual.outcome }}" != "success" ] || [ "${{ steps.motion.outcome }}" != "success" ] || [ "${{ steps.webkit.outcome }}" != "success" ] || [ "${{ steps.lighthouse.outcome }}" != "success" ]; then
            echo "Production Quality Gate fehlgeschlagen – kein Livegang."
            exit 1
          fi
          echo "Production Quality Gate bestanden."

      - name: Netlify-Zugang prüfen
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "NETLIFY_AUTH_TOKEN oder NETLIFY_SITE_ID fehlt im GitHub-Environment production."
            exit 1
          fi

      - name: Produktionskandidat auf Netlify veröffentlichen
        id: netlify
        run: |
          npm exec --yes --package=netlify-cli@27.4.1 -- netlify deploy \
            --prod \
            --no-build \
            --dir=dist \
            --functions=netlify/functions \
            --message="GitHub ${GITHUB_SHA} ${RELEASE_NOTE}" \
            --json > /tmp/netlify-deploy.json

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const deploy = JSON.parse(fs.readFileSync('/tmp/netlify-deploy.json', 'utf8'));
          const deployUrl = deploy.deploy_url || deploy.deployUrl || '';
          const liveUrl = deploy.url || 'https://wunschausbau.de';
          const deployId = deploy.deploy_id || deploy.deployId || deploy.id || '';
          if (!deployUrl) throw new Error('Netlify Deploy URL fehlt in der CLI-Antwort.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `deploy_url=${deployUrl}\nlive_url=${liveUrl}\ndeploy_id=${deployId}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Production Deploy\n\n- Live: ${liveUrl}\n- Atomic Deploy: ${deployUrl}\n- Deploy ID: ${deployId || 'nicht geliefert'}\n- Commit: ${process.env.GITHUB_SHA}\n`);
          NODE

      - name: Live-Smoke-Test
        env:
          LIVE_URL: ${{ steps.netlify.outputs.live_url }}
        run: |
          base="${LIVE_URL%/}"
          for path in / /leistungen/ /kontakt/ /robots.txt; do
            echo "Prüfe ${base}${path}"
            curl --fail --silent --show-error --location --max-time 20 "${base}${path}" > /dev/null
          done

      - name: QA-Artefakte hochladen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-qa-${{ github.sha }}
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 30
