name: Sync package-lock

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/sync-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Lockfile aus package.json reproduzierbar aktualisieren
        run: npm install --package-lock-only --ignore-scripts

      - name: Aktualisierten Lockfile committen
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json ist bereits synchron."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sync package-lock with package.json"
          git push
