name: Temporary Locale QA Race Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Patch locale routing assertion
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/cross-browser-qa.mjs')
          s = p.read_text()
          old = """      await page.goto(`${baseUrl}/`, { waitUntil: 'domcontentloaded' });
                await page.waitForURL((url) => url.pathname.endsWith('/en/'), { timeout: 6_000 });
                const state = await page.evaluate(() => ({ lang: document.documentElement.lang, pathname: location.pathname }));
          """
          new = """      await page.goto(`${baseUrl}/`, { waitUntil: 'domcontentloaded' });
                await page.waitForURL((url) => url.pathname.endsWith('/en/'), { timeout: 6_000 });
                await page.waitForFunction(
                  () => document.documentElement.lang === 'en' && location.pathname.endsWith('/en/'),
                  { timeout: 6_000 }
                );
                await page.waitForLoadState('domcontentloaded');
                const state = await page.evaluate(() => ({ lang: document.documentElement.lang, pathname: location.pathname }));
          """
          if old not in s:
              raise SystemExit('Expected locale QA snippet not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/cross-browser-qa.mjs
          git commit -m "test: wait for localized document after redirect"
          git push origin HEAD:main
