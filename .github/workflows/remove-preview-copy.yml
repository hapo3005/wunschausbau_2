name: Remove Preview Copy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove customer-facing preview copy
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('src/pages/index.astro'): [
                  (
                      '          <p>Die Motive definieren aktuell unsere Bildsprache. Zum Launch ersetzen wir sie durch freigegebene Originalprojekte von KS-Innenausbau.</p>',
                      '          <p>Ausgewählte Einblicke in Räume, Materialien und handwerkliche Details unserer Leistungsbereiche.</p>'
                  ),
              ],
              Path('src/pages/referenzen.astro'): [
                  (
                      '            <p class="lead">Die aktuelle Vorschau ordnet unsere Leistungsbereiche über Räume, Materialien und handwerkliche Details ein.</p>',
                      '            <p class="lead">Einblicke in Räume, Materialien und handwerkliche Details aus unseren Leistungsbereichen.</p>'
                  ),
                  (
                      '            <p class="preview-note">Zum Launch zeigen wir hier ausschließlich freigegebene Originalaufnahmen realisierter KS-Projekte.</p>\n',
                      ''
                  ),
              ],
              Path('src/pages/en/index.astro'): [
                  (
                      '          <p>These images currently define the visual direction. For launch, they will be replaced by approved original projects from KS-Innenausbau.</p>',
                      '          <p>Selected views of spaces, materials and craftsmanship across our service areas.</p>'
                  ),
              ],
              Path('src/pages/en/references.astro'): [
                  (
                      '            <p class="lead">This preview presents our service areas through spaces, materials and construction details.</p>',
                      '            <p class="lead">A closer look at spaces, materials and construction details across our service areas.</p>'
                  ),
                  (
                      '            <p class="preview-note">For launch, this section will show only approved original photographs from completed KS-Innenausbau projects.</p>\n',
                      ''
                  ),
              ],
          }

          changed = False
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed = True

          if not changed:
              print('No preview copy left to remove.')

      - name: Verify preview wording is gone
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'aktuelle Vorschau|Zum Launch|currently define the visual direction|For launch, this section|This preview presents' src/pages/index.astro src/pages/referenzen.astro src/pages/en/index.astro src/pages/en/references.astro

      - name: Commit cleanup when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/index.astro src/pages/referenzen.astro src/pages/en/index.astro src/pages/en/references.astro
          git commit -m 'content: remove preview copy from customer pages'
          git push
