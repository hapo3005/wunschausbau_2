name: Temporary Security Lock Refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Ausgangsstand installieren
        run: npm ci

      - name: Sicherheitsupdates im Lockfile anwenden
        run: npm audit fix --package-lock-only

      - name: Nur Lockfile-Aenderungen zulassen
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          echo "$changed"
          if [ -n "$changed" ] && [ "$changed" != "package-lock.json" ]; then
            echo "Unerwartete Dateiänderungen: $changed"
            exit 1
          fi

      - name: Aktualisierten Stand installieren
        run: npm ci

      - name: Produktionsabhaengigkeiten pruefen
        run: npm audit --omit=dev --audit-level=high

      - name: Lockfile committen
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Keine Lockfile-Aenderung erforderlich."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: refresh vulnerable dependency lock"
          git push origin HEAD:main
