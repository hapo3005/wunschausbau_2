name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Astro bauen und Artefakt hochladen
        uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6
        with:
          node-version: 24

  quality:
    name: Visual & Quality QA
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      QA_BASE_URL: http://127.0.0.1:4321/wunschausbau_2
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Projekt installieren
        run: npm ci

      - name: Produktionsabhängigkeiten prüfen
        run: npm audit --omit=dev --audit-level=high

      - name: QA-Build erzeugen
        run: npm run build

      - name: Browser-QA Werkzeuge installieren
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 @axe-core/playwright@4.10.2 lighthouse@12.8.2
          npx playwright install --with-deps chromium

      - name: Lokale Preview starten
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/wunschausbau-preview.log 2>&1 &
          echo $! > /tmp/wunschausbau-preview.pid
          for i in {1..30}; do
            if curl -fsS "$QA_BASE_URL/" > /dev/null; then
              echo "Preview erreichbar."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wunschausbau-preview.log
          exit 1

      - name: Chromium Visual QA
        id: visual
        continue-on-error: true
        run: npm run qa:visual

      - name: Motion & No-JS QA
        id: motion
        continue-on-error: true
        run: node scripts/motion-qa.mjs

      - name: Lighthouse Audit
        id: lighthouse
        continue-on-error: true
        run: |
          mkdir -p qa-artifacts/lighthouse
          export CHROME_PATH="$(node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")"
          npx lighthouse "$QA_BASE_URL/" \
            --quiet \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output=html \
            --output-path=qa-artifacts/lighthouse/home
          npm run qa:lighthouse

      - name: QA-Zusammenfassung anzeigen
        if: always()
        run: |
          if [ -f qa-artifacts/visual-qa.md ]; then
            cat qa-artifacts/visual-qa.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f qa-artifacts/motion-qa.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat qa-artifacts/motion-qa.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f qa-artifacts/lighthouse/lighthouse-summary.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Lighthouse" >> "$GITHUB_STEP_SUMMARY"
            node --input-type=module - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('qa-artifacts/lighthouse/lighthouse-summary.json', 'utf8'));
          for (const report of data.reports) {
            const scores = Object.entries(report.scores).map(([k,v]) => `${k}: ${typeof v === 'number' ? Math.round(v * 100) : 'n/a'}`).join(' · ');
            console.log(`- ${scores}`);
          }
          NODE
          fi

      - name: Screenshots und Reports hochladen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-qa-${{ github.sha }}
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Quality Gate
        if: always()
        run: |
          echo "Visual QA: ${{ steps.visual.outcome }}"
          echo "Motion QA: ${{ steps.motion.outcome }}"
          echo "Lighthouse: ${{ steps.lighthouse.outcome }}"
          if [ "${{ steps.visual.outcome }}" != "success" ] || [ "${{ steps.motion.outcome }}" != "success" ] || [ "${{ steps.lighthouse.outcome }}" != "success" ]; then
            echo "Quality Gate fehlgeschlagen – Deployment wird gestoppt."
            exit 1
          fi
          echo "Quality Gate bestanden."

  deploy:
    needs: [build, quality]
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
